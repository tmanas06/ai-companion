<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="aria-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="aria-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aria-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="aria-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="aria-cloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#aria-bg)"/>
  <circle cx="150" cy="130" r="110" fill="url(#aria-glow)"/>

  <!-- Back Hair -->
  <path d="M90 120 C70 170 70 230 95 260 C110 240 100 180 110 140 Z" fill="url(#aria-hair)"/>
  <path d="M210 120 C230 170 230 230 205 260 C190 240 200 180 190 140 Z" fill="url(#aria-hair)"/>

  <!-- Torso & Clothing -->
  <path d="M80 280 C95 240 120 220 150 220 C180 220 205 240 220 280 L220 300 L80 300 Z" fill="url(#aria-cloth)" filter="url(#soft-shadow)"/>
  <!-- Collar Accent -->
  <path d="M125 220 L150 250 L175 220" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M135 190 L135 225 C145 228 155 228 165 225 L165 190 Z" fill="#fdba74"/>

  <!-- Head / Face -->
  <ellipse cx="150" cy="145" rx="52" ry="62" fill="url(#aria-skin)" filter="url(#soft-shadow)"/>

  <!-- Ears -->
  <ellipse cx="98" cy="148" rx="7" ry="12" fill="#fdba74"/>
  <ellipse cx="202" cy="148" rx="7" ry="12" fill="#fdba74"/>
  <circle cx="98" cy="155" r="2.5" fill="#fef08a"/>
  <circle cx="202" cy="155" r="2.5" fill="#fef08a"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="130" cy="140" rx="9" ry="5.5" fill="#ffffff"/>
  <circle cx="131" cy="140" r="4.5" fill="#1e3a8a"/>
  <circle cx="132" cy="138.5" r="1.5" fill="#ffffff"/>
  <!-- Right Eye -->
  <ellipse cx="170" cy="140" rx="9" ry="5.5" fill="#ffffff"/>
  <circle cx="169" cy="140" r="4.5" fill="#1e3a8a"/>
  <circle cx="170" cy="138.5" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M120 131 C126 128 135 128 141 131" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M159 131 C165 128 174 128 180 131" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M148 143 L146 156 L152 158" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lips -->
  <path d="M137 172 C143 176 157 176 163 172" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M141 172 C146 170 154 170 159 172" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="120" cy="155" rx="8" ry="4" fill="#f43f5e" opacity="0.25"/>
  <ellipse cx="180" cy="155" rx="8" ry="4" fill="#f43f5e" opacity="0.25"/>

  <!-- Front Hair / Styling -->
  <path d="M96 130 C95 85 130 75 150 75 C170 75 205 85 204 130 C195 105 180 95 150 95 C120 95 105 105 96 130 Z" fill="url(#aria-hair)"/>
  <path d="M100 115 C115 130 120 150 118 165 C114 150 110 135 100 115 Z" fill="url(#aria-hair)"/>
  <path d="M200 115 C185 130 180 150 182 165 C186 150 190 135 200 115 Z" fill="url(#aria-hair)"/>

  <!-- Style Tag Pill -->
  <rect x="20" y="20" width="105" height="24" rx="12" fill="#000000" fill-opacity="0.45"/>
  <text x="72.5" y="36" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">PHOTOREALISTIC</text>
</svg>
