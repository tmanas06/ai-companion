<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nova-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="nova-sphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <radialGradient id="nova-highlight" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nova-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="nova-bloom">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#nova-bg)"/>

  <!-- Orbital Cyber Rings (3D perspective) -->
  <ellipse cx="150" cy="150" rx="115" ry="40" fill="none" stroke="url(#nova-ring)" stroke-width="4" transform="rotate(-25 150 150)" opacity="0.85" filter="url(#nova-bloom)"/>

  <!-- Torso (Stylized 3D Android chassis) -->
  <path d="M90 260 C105 230 130 220 150 220 C170 220 195 230 210 260 L210 300 L90 300 Z" fill="#3f3f46"/>
  <ellipse cx="150" cy="245" rx="20" ry="10" fill="#06b6d4" opacity="0.75" filter="url(#nova-bloom)"/>

  <!-- Neck Link -->
  <rect x="142" y="195" width="16" height="30" rx="5" fill="#52525b"/>

  <!-- 3D Head Sphere -->
  <ellipse cx="150" cy="140" rx="56" ry="62" fill="url(#nova-sphere)"/>
  <ellipse cx="140" cy="125" rx="36" ry="40" fill="url(#nova-highlight)"/>

  <!-- Digital Visor / Expressive LED Eyes -->
  <rect x="110" y="125" width="80" height="30" rx="15" fill="#09090b" opacity="0.9"/>
  <!-- Glowing LED Eyes inside visor -->
  <ellipse cx="132" cy="140" rx="8" ry="7" fill="#67e8f9" filter="url(#nova-bloom)"/>
  <circle cx="132" cy="140" r="3.5" fill="#ffffff"/>

  <ellipse cx="168" cy="140" rx="8" ry="7" fill="#67e8f9" filter="url(#nova-bloom)"/>
  <circle cx="168" cy="140" r="3.5" fill="#ffffff"/>

  <!-- Front overlapping Orbital Ring -->
  <path d="M45 180 C80 205 210 180 255 125" fill="none" stroke="url(#nova-ring)" stroke-width="4.5" filter="url(#nova-bloom)"/>

  <!-- Floating Hologram Sparkles -->
  <circle cx="75" cy="80" r="3.5" fill="#a855f7" filter="url(#nova-bloom)"/>
  <circle cx="230" cy="70" r="4.5" fill="#06b6d4" filter="url(#nova-bloom)"/>
  <circle cx="215" cy="210" r="3" fill="#f43f5e" filter="url(#nova-bloom)"/>

  <!-- Style Tag Pill -->
  <rect x="20" y="20" width="45" height="24" rx="12" fill="#000000" fill-opacity="0.45"/>
  <text x="42.5" y="36" fill="#67e8f9" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">3D</text>
</svg>
