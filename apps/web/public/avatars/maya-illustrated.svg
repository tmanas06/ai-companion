<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="maya-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="maya-sun" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maya-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <linearGradient id="maya-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="50%" stop-color="#a21caf"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#maya-bg)"/>
  <circle cx="150" cy="115" r="95" fill="url(#maya-sun)"/>

  <!-- Warm Graphic Shapes / Abstract sunburst rays -->
  <circle cx="60" cy="80" r="15" fill="#fde047" opacity="0.6"/>
  <circle cx="230" cy="90" r="22" fill="#fb923c" opacity="0.5"/>
  <polygon points="150,15 155,30 145,30" fill="#ffffff" opacity="0.7"/>

  <!-- Curly Bun / Back Hair Silhouette -->
  <circle cx="150" cy="65" r="38" fill="url(#maya-hair)"/>

  <!-- Shoulders & Bold Terracotta Top -->
  <path d="M80 270 C95 235 120 220 150 220 C180 220 205 235 220 270 L220 300 L80 300 Z" fill="#4c0519"/>
  <!-- Gold statement earrings -->
  <circle cx="95" cy="155" r="10" fill="none" stroke="#facc15" stroke-width="3"/>
  <circle cx="205" cy="155" r="10" fill="none" stroke="#facc15" stroke-width="3"/>

  <!-- Neck -->
  <path d="M136 185 L136 225 C145 228 155 228 164 225 L164 185 Z" fill="#fba868"/>

  <!-- Illustrated Head -->
  <ellipse cx="150" cy="142" rx="48" ry="56" fill="url(#maya-skin)"/>

  <!-- Hair Band / Curly fringe -->
  <rect x="100" y="88" width="100" height="14" rx="7" fill="#facc15"/>
  <path d="M102 95 C115 115 125 110 135 95 C145 115 155 110 165 95 C175 115 185 110 198 95" fill="none" stroke="url(#maya-hair)" stroke-width="12" stroke-linecap="round"/>

  <!-- Expressive Stylized Eyes -->
  <ellipse cx="130" cy="140" rx="9" ry="7" fill="#4a044e"/>
  <circle cx="132" cy="138" r="2.8" fill="#ffffff"/>
  <ellipse cx="170" cy="140" rx="9" ry="7" fill="#4a044e"/>
  <circle cx="172" cy="138" r="2.8" fill="#ffffff"/>

  <!-- Graphic Eyebrows -->
  <path d="M118 126 Q128 120 142 124" fill="none" stroke="#4a044e" stroke-width="3" stroke-linecap="round"/>
  <path d="M158 124 Q172 120 182 126" fill="none" stroke="#4a044e" stroke-width="3" stroke-linecap="round"/>

  <!-- Warm Cheerful Smile -->
  <path d="M136 170 Q150 184 164 170" fill="#be123c"/>
  <path d="M138 170 Q150 174 162 170" fill="#ffffff"/>

  <!-- Style Tag Pill -->
  <rect x="20" y="20" width="95" height="24" rx="12" fill="#000000" fill-opacity="0.45"/>
  <text x="67.5" y="36" fill="#fef08a" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">ILLUSTRATED</text>
</svg>
