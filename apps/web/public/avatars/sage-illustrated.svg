<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sage-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="sage-sun" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sage-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="sage-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#sage-bg)"/>
  <circle cx="150" cy="115" r="95" fill="url(#sage-sun)"/>

  <!-- Botanical Illustrated Leaves in background -->
  <path d="M40 220 Q70 170 110 190 Q70 230 40 220 Z" fill="#86efac" opacity="0.6"/>
  <path d="M260 220 Q230 170 190 190 Q230 230 260 220 Z" fill="#86efac" opacity="0.6"/>

  <!-- Shoulders & Earthy Tunic -->
  <path d="M80 270 C95 235 120 220 150 220 C180 220 205 235 220 270 L220 300 L80 300 Z" fill="#fef08a"/>
  <!-- Leaf pattern necklace -->
  <path d="M125 220 Q150 245 175 220" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="150" cy="245" r="4.5" fill="#15803d"/>

  <!-- Neck -->
  <path d="M136 185 L136 225 C145 228 155 228 164 225 L164 185 Z" fill="#f5d0fe"/>

  <!-- Illustrated Soft Head -->
  <ellipse cx="150" cy="142" rx="50" ry="58" fill="url(#sage-skin)"/>

  <!-- Flowing Botanical Hair -->
  <path d="M95 125 C85 75 125 65 150 65 C175 65 215 75 205 125 C195 95 180 85 150 85 C120 85 105 95 95 125 Z" fill="url(#sage-hair)"/>
  <path d="M92 120 C80 160 85 200 100 230 C90 190 95 150 100 130 Z" fill="url(#sage-hair)"/>
  <path d="M208 120 C220 160 215 200 200 230 C210 190 205 150 200 130 Z" fill="url(#sage-hair)"/>

  <!-- Laurel Leaf Crown in Hair -->
  <path d="M110 95 Q125 80 140 90" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 95 Q175 80 160 90" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>

  <!-- Gentle Eyes (peaceful, crescent smile) -->
  <path d="M122 142 Q131 136 140 142" fill="none" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 142 Q169 136 178 142" fill="none" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>

  <!-- Soft Eyebrows -->
  <path d="M120 130 Q130 124 140 130" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 130 Q170 124 180 130" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

  <!-- Soft Nose & Gentle Smile -->
  <circle cx="150" cy="155" r="2" fill="#15803d" opacity="0.4"/>
  <path d="M138 170 Q150 178 162 170" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Illustrated Watercolor Blushes -->
  <circle cx="118" cy="155" r="8" fill="#f472b6" opacity="0.3"/>
  <circle cx="182" cy="155" r="8" fill="#f472b6" opacity="0.3"/>

  <!-- Style Tag Pill -->
  <rect x="20" y="20" width="95" height="24" rx="12" fill="#000000" fill-opacity="0.45"/>
  <text x="67.5" y="36" fill="#bbf7d0" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">ILLUSTRATED</text>
</svg>
