<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="luna-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="luna-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luna-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="luna-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="luna-eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#luna-bg)"/>
  <circle cx="150" cy="120" r="110" fill="url(#luna-glow)"/>

  <!-- Back Hair (Twin tails / long anime locks) -->
  <path d="M60 100 C30 180 50 250 80 280 C60 220 70 160 85 120 Z" fill="url(#luna-hair)"/>
  <path d="M240 100 C270 180 250 250 220 280 C240 220 230 160 215 120 Z" fill="url(#luna-hair)"/>

  <!-- Clothing / Sailor collar / Idol jacket -->
  <path d="M85 270 C100 235 125 220 150 220 C175 220 200 235 215 270 L215 300 L85 300 Z" fill="#18181b"/>
  <polygon points="120,230 150,265 180,230 165,220 150,240 135,220" fill="#ec4899"/>
  <!-- Star brooch -->
  <circle cx="150" cy="245" r="4.5" fill="#facc15"/>

  <!-- Neck -->
  <path d="M140 185 L140 225 C146 227 154 227 160 225 L160 185 Z" fill="#fecdd3"/>

  <!-- Anime Chin / Head -->
  <path d="M105 130 C105 175 135 205 150 208 C165 205 195 175 195 130 C195 95 165 85 150 85 C135 85 105 95 105 130 Z" fill="url(#luna-skin)"/>

  <!-- Anime Eyes (Large, expressive) -->
  <!-- Left Eye -->
  <ellipse cx="130" cy="142" rx="12" ry="16" fill="url(#luna-eye)"/>
  <ellipse cx="127" cy="136" rx="4.5" ry="6" fill="#ffffff"/>
  <ellipse cx="134" cy="148" rx="2" ry="2.5" fill="#ffffff"/>
  <!-- Right Eye -->
  <ellipse cx="170" cy="142" rx="12" ry="16" fill="url(#luna-eye)"/>
  <ellipse cx="167" cy="136" rx="4.5" ry="6" fill="#ffffff"/>
  <ellipse cx="174" cy="148" rx="2" ry="2.5" fill="#ffffff"/>

  <!-- Eyelashes / Liner -->
  <path d="M115 132 C125 125 137 127 144 135" fill="none" stroke="#581c87" stroke-width="3" stroke-linecap="round"/>
  <path d="M156 135 C163 127 175 125 185 132" fill="none" stroke="#581c87" stroke-width="3" stroke-linecap="round"/>

  <!-- Anime Blush -->
  <ellipse cx="118" cy="158" rx="9" ry="5" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="182" cy="158" rx="9" ry="5" fill="#f43f5e" opacity="0.4"/>

  <!-- Anime Nose -->
  <circle cx="150" cy="160" r="1.5" fill="#e11d48"/>

  <!-- Anime Smile -->
  <path d="M142 176 C147 182 153 182 158 176" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Anime Bangs / Front Hair -->
  <path d="M102 125 C100 80 130 65 150 65 C170 65 200 80 198 125 C185 110 170 120 160 100 C155 125 145 125 140 105 C135 125 120 125 115 105 C108 120 105 115 102 125 Z" fill="url(#luna-hair)"/>
  <!-- Ahoge / Hair Cowlick -->
  <path d="M150 65 C155 45 168 40 170 50 C165 45 158 55 150 65 Z" fill="#c084fc"/>

  <!-- Star Hairclip -->
  <polygon points="112,85 115,92 122,93 117,98 118,105 112,101 106,105 107,98 102,93 109,92" fill="#fde047"/>

  <!-- Style Tag Pill -->
  <rect x="20" y="20" width="65" height="24" rx="12" fill="#000000" fill-opacity="0.45"/>
  <text x="52.5" y="36" fill="#fbcfe8" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">ANIME</text>
</svg>
