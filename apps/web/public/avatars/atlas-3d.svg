<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="atlas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="atlas-core" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <linearGradient id="atlas-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="gold-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#atlas-bg)"/>

  <!-- Geometric 3D Floating Polyhedral Halo -->
  <polygon points="150,45 220,85 220,165 150,205 80,165 80,85" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0.65" filter="url(#gold-glow)"/>

  <!-- 3D Shoulders / Armor -->
  <path d="M70 270 C90 230 120 220 150 220 C180 220 210 230 230 270 L230 300 L70 300 Z" fill="url(#atlas-armor)"/>
  <!-- Gold chestplate rune -->
  <polygon points="150,240 165,260 135,260" fill="#fde047" filter="url(#gold-glow)"/>

  <!-- Neck -->
  <rect x="140" y="190" width="20" height="35" rx="6" fill="#334155"/>

  <!-- 3D Head Form (faceted geometric sphere) -->
  <ellipse cx="150" cy="140" rx="54" ry="60" fill="url(#atlas-core)"/>

  <!-- Sleek Visor Plate -->
  <polygon points="110,130 190,130 175,158 125,158" fill="#1e293b"/>
  <!-- Luminous Golden Gaze Line -->
  <line x1="120" y1="144" x2="180" y2="144" stroke="#fef08a" stroke-width="4" stroke-linecap="round" filter="url(#gold-glow)"/>

  <!-- Halo Nodes -->
  <circle cx="150" cy="45" r="5" fill="#fde047" filter="url(#gold-glow)"/>
  <circle cx="220" cy="85" r="5" fill="#fde047" filter="url(#gold-glow)"/>
  <circle cx="80" cy="85" r="5" fill="#fde047" filter="url(#gold-glow)"/>

  <!-- Style Tag Pill -->
  <rect x="20" y="20" width="45" height="24" rx="12" fill="#000000" fill-opacity="0.45"/>
  <text x="42.5" y="36" fill="#fde047" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">3D</text>
</svg>
